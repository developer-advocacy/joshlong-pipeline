# the names and hosts of joshlong.com on the mypaas foundation (bosh-platform-installer/mypaas.env,
# api.cf.mypaas.online). no secrets here: bin/deploy.sh adds those from the environment.

# the foundation's api, for the github actions workflow.
cf-api: https://api.cf.mypaas.online

# where the apps go. bin/deploy.sh targets these; it doesn't create them.
org: developer-advocacy
space: production

registry: us-docker.pkg.dev/joshlong/developer-advocacy-artifact-registry
domain: joshlong.com
apps-domain: apps.mypaas.online
site-host: joshlong-site
api-host: joshlong-api

# where the api tells the world it is, in the links it hands out.
api-server-uri: https://api.joshlong.com
